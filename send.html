<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📍 ကျွန်ုပ်၏တည်နေရာ မျှဝေရန်</title>
    <script src="https://www.gstatic.com/firebasejs/11.3.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.3.1/firebase-database-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
        body{background:linear-gradient(135deg,#4facfe,#00f2fe);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
        .card{background:white;border-radius:20px;padding:30px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.15);}
        h2{text-align:center;color:#1e40af;margin-bottom:20px;}
        
        .my-location-box{background:#e0f2fe;border-radius:12px;padding:18px;margin-bottom:20px;}
        .my-location-title{font-weight:bold;color:#1e40af;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
        .detect-btn{width:100%;padding:12px;font-size:15px;border:none;border-radius:8px;background:#3b82f6;color:white;cursor:pointer;font-weight:bold;margin-bottom:12px;}
        .detect-btn:disabled{background:#ccc;cursor:not-allowed;}
        .coords{background:white;border-radius:8px;padding:12px;display:none;}
        .coords.show{display:block;}
        .coord-row{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;}
        .label{color:#64748b;}
        .value{color:#1e40af;font-weight:600;}
        
        input{width:100%;padding:14px;font-size:16px;border:2px solid #e5e7eb;border-radius:10px;margin-bottom:12px;}
        input:focus{outline:none;border-color:#3b82f6;}
        #sendBtn{width:100%;padding:14px;font-size:17px;border:none;border-radius:10px;background:linear-gradient(135deg,#4facfe,#00f2fe);color:white;cursor:pointer;font-weight:bold;display:none;}
        #sendBtn:disabled{background:#ccc;cursor:not-allowed;}
        .status{margin-top:15px;padding:12px;border-radius:8px;display:none;}
        .success{background:#d4edda;color:#155724;display:block;}
        .error{background:#f8d7da;color:#721c24;display:block;}
    </style>
</head>
<body>
    <div class="card">
        <h2>📍 တည်နေရာမျှဝေရန်</h2>

        <div class="my-location-box">
            <div class="my-location-title">👁️ ကျွန်ုပ်ဘယ်ရောက်နေလဲ ကြည့်ရန်</div>
            <button id="detectBtn" class="detect-btn">🔍 ကျွန်ုပ်၏တည်နေရာကို ရှာပါ</button>
            <div id="coordsBox" class="coords">
                <div class="coord-row"><span class="label">လတီကျူ့ဒ် :</span><span class="value" id="myLat">--</span></div>
                <div class="coord-row"><span class="label">လောင်ဂျီကျူ့ဒ် :</span><span class="value" id="myLng">--</span></div>
                <div style="margin-top:10px;text-align:center;">
                    <a id="mapLink" href="" target="_blank" style="color:#16a34a;font-size:14px;text-decoration:none;font-weight:bold;display:none;">🌍 မြေပုံတွင်ကြည့်ရန်</a>
                </div>
            </div>
        </div>

        <input type="text" id="name" placeholder="သင့်နာမည်" style="display:none;">
        <input type="password" id="pass" placeholder="ကြည့်ရှုခွင့် စကားဝှက်" style="display:none;">
        <button id="sendBtn">📡 တည်နေရာကို မျှဝေပါ</button>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCrto0f0amUQbRpfshWgyvErrurzq0Ksjw",
            authDomain: "my-location-share-8bf0f.firebaseapp.com",
            databaseURL: "https://my-location-share-8bf0f-default-rtdb.firebaseio.com",
            projectId: "my-location-share-8bf0f",
            storageBucket: "my-location-share-8bf0f.firebasestorage.app",
            messagingSenderId: "211556349618",
            appId: "1:211556349618:web:bd5b82d1a01202064bbbab"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const detectBtn = document.getElementById('detectBtn');
        const coordsBox = document.getElementById('coordsBox');
        const myLat = document.getElementById('myLat');
        const myLng = document.getElementById('myLng');
        const mapLink = document.getElementById('mapLink');
        const nameInput = document.getElementById('name');
        const passInput = document.getElementById('pass');
        const sendBtn = document.getElementById('sendBtn');
        const status = document.getElementById('status');

        let currentLat, currentLng;

        function showStatus(msg, type) {
            status.textContent = msg;
            status.className = 'status ' + type;
        }
        function hashPass(pass) {
            let h=0;for(let i=0;i<pass.length;i++)h=((h<<5)-h)+pass.charCodeAt(i);
            return Math.abs(h).toString(16);
        }

        detectBtn.addEventListener('click', () => {
            detectBtn.disabled = true;
            detectBtn.textContent = '⏳ ရှာနေသည်...';
            
            if(!navigator.geolocation){
                showStatus('❌ တည်နေရာမထောက်ပံ့ပါ', 'error');
                detectBtn.disabled = false;
                detectBtn.textContent = '🔍 ကျွန်ုပ်၏တည်နေရာကို ရှာပါ';
                return;
            }
            
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    currentLat = pos.coords.latitude;
                    currentLng = pos.coords.longitude;
                    myLat.textContent = currentLat.toFixed(6);
                    myLng.textContent = currentLng.toFixed(6);
                    mapLink.href = `https://google.com/maps?q=${currentLat},${currentLng}`;
                    mapLink.style.display = 'block';
                    coordsBox.classList.add('show');
                    detectBtn.textContent = '✅ တည်နေရာတွေ့ပြီ';
                    detectBtn.style.background = '#16a34a';
                    
                    nameInput.style.display = 'block';
                    passInput.style.display = 'block';
                    sendBtn.style.display = 'block';
                    showStatus('✅ တည်နေရာမှန်ကန်ပါသည်။ နာမည်နှင့်စကားဝှက်ဖြည့်ပါ', 'success');
                },
                (err) => {
                    let msg='❌ အမှား';
                    if(err.code===1)msg='❌ တည်နေရာခွင့်မပေးထားပါ';
                    if(err.code===2)msg='❌ နေရာရှာမတွေ့ပါ — အပြင်သို့သွားပါ';
                    if(err.code===3)msg='❌ အချိန်ကုန်သွားပါပြီ — ထပ်နှိပ်ပါ';
                    showStatus(msg, 'error');
                    detectBtn.disabled = false;
                    detectBtn.textContent = '🔍 ကျွန်ုပ်၏တည်နေရာကို ရှာပါ';
                },
                {enableHighAccuracy:true, timeout:20000}
            );
        });

        sendBtn.addEventListener('click', async () => {
            const name = nameInput.value.trim();
            const pass = passInput.value.trim();
            if(!name){showStatus('❌ နာမည်ရိုက်ထည့်ပါ','error');return;}
            if(!pass){showStatus('❌ စကားဝှက်သတ်မှတ်ပါ','error');return;}
            
            sendBtn.disabled = true;
            showStatus('⏳ ပို့နေသည်...', 'success');
            
            try{
                const safeName = name.replace(/[.#$/[\]]/g, '_');
                await db.ref('users/' + safeName).set({
                    name: name,
                    passwordHash: hashPass(pass),
                    latitude: currentLat,
                    longitude: currentLng,
                    timestamp: new Date().toLocaleString()
                });
                showStatus(`✅ ပို့ပြီးပါပြီ!`, 'success');
            }catch(err){
                showStatus('❌ အမှား - '+err.message, 'error');
            }
            sendBtn.disabled = false;
        });
    </script>
</body>
</html>
