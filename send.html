<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Location</title>
    <script src="https://www.gstatic.com/firebasejs/11.3.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.3.1/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: linear-gradient(135deg, #4facfe, #00f2fe); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card { background: white; border-radius: 16px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        button { width: 100%; padding: 14px; font-size: 17px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        #sendBtn { background: linear-gradient(135deg, #4facfe, #00f2fe); color: white; }
        #sendBtn:disabled { background: #ccc; cursor: not-allowed; }
        .status { margin-top: 20px; padding: 12px; border-radius: 8px; text-align: center; display: none; }
        .success { background: #d4edda; color: #155724; display:block !important; }
        .error { background: #f8d7da; color: #721c24; display:block !important; }
        .info { background: #d1ecf1; color: #0c5460; display:block !important; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📍 Send My Location</h2>
        <button id="sendBtn">📡 Share Current Location</button>
        <div class="status" id="status"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCrto0f0amUQbRpfshWgyvErrurzq0Ksjw",
            authDomain: "my-location-share-8bf0f.firebaseapp.com",
            databaseURL: "https://my-location-share-8bf0f-default-rtdb.firebaseio.com",
            projectId: "my-location-share-8bf0f",
            storageBucket: "my-location-share-8bf0f.firebasestorage.app",
            messagingSenderId: "211556349618",
            appId: "1:211556349618:web:bd5b82d1a01202064bbbab"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const sendBtn = document.getElementById('sendBtn');
        const status = document.getElementById('status');

        function showStatus(msg, type) {
            status.textContent = msg;
            status.className = 'status ' + type;
        }

        sendBtn.addEventListener('click', async () => {
            showStatus('⏳ Getting location...', 'info');
            sendBtn.disabled = true;

            if (!navigator.geolocation) {
                showStatus('❌ Your browser does not support location', 'error');
                sendBtn.disabled = false;
                return;
            }

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    try {
                        const data = {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            timestamp: new Date().toLocaleString()
                        };
                        
                        await db.ref('locations').set(data);
                        showStatus('✅ Location sent successfully!', 'success');
                    } catch (err) {
                        showStatus('❌ Firebase Error: ' + err.message, 'error');
                    }
                    sendBtn.disabled = false;
                },
                (err) => {
                    let msg = 'Error: ' + err.message;
                    if (err.code === 1) msg = '❌ Please ALLOW location access!';
                    if (err.code === 2) msg = '❌ Cannot determine location';
                    if (err.code === 3) msg = '❌ Location request timed out';
                    showStatus(msg, 'error');
                    sendBtn.disabled = false;
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        });
    </script>
</body>
</html>
