<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📍 တည်နေရာပို့ရန်</title>
    <script src="https://www.gstatic.com/firebasejs/11.3.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.3.1/firebase-database-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
        body{background:linear-gradient(135deg,#4facfe,#00f2fe);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
        .card{background:white;border-radius:20px;padding:25px;max-width:400px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.15);}
        h2{text-align:center;color:#1e40af;margin-bottom:20px;}
        .loc-box{background:#e0f2fe;border-radius:10px;padding:15px;margin-bottom:15px;display:none;}
        .loc-box.show{display:block;}
        .row{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;}
        input{width:100%;padding:12px;font-size:16px;border:2px solid #e5e7eb;border-radius:8px;margin-bottom:12px;}
        button{width:100%;padding:13px;font-size:16px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;}
        .btn-blue{background:#3b82f6;color:white;margin-bottom:10px;}
        .btn-green{background:#16a34a;color:white;display:none;}
        .status{margin-top:12px;padding:10px;border-radius:6px;display:none;font-size:14px;}
        .ok{background:#d4edda;color:#155724;display:block;}
        .err{background:#f8d7da;color:#721c24;display:block;}
        .tip{margin-top:15px;text-align:center;font-size:13px;color:#64748b;}
    </style>
</head>
<body>
    <div class="card">
        <h2>📍 တည်နေရာပို့ရန်</h2>
        
        <button id="detectBtn" class="btn-blue">🔍 ကျွန်ုပ်၏တည်နေရာကို ရှာပါ</button>
        
        <div id="locBox" class="loc-box">
            <div class="row"><b>လတီကျူ့ဒ်:</b> <span id="lat">--</span></div>
            <div class="row"><b>လောင်ဂျီကျူ့ဒ်:</b> <span id="lng">--</span></div>
        </div>

        <input type="text" id="name" placeholder="သင့်နာမည်" style="display:none;">
        <input type="password" id="pass" placeholder="စကားဝှက်သတ်မှတ်ပါ" style="display:none;">
        <button id="sendBtn" class="btn-green">📡 တည်နေရာပို့ပါ</button>
        
        <div id="status" class="status"></div>
        <div class="tip">✅ ပို့ပြီးရင် တက်ဘ်ကို ကိုယ်တိုင်ပိတ်လိုက်ပါ — လုံခြုံပါတယ်</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCrto0f0amUQbRpfshWgyvErrurzq0Ksjw",
            authDomain: "my-location-share-8bf0f.firebaseapp.com",
            databaseURL: "https://my-location-share-8bf0f-default-rtdb.firebaseio.com",
            projectId: "my-location-share-8bf0f",
            storageBucket: "my-location-share-8bf0f.firebasestorage.app",
            messagingSenderId: "211556349618",
            appId: "1:211556349618:web:bd5b82d1a01202064bbbab"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let lat, lng;
        const detectBtn = document.getElementById('detectBtn');
        const locBox = document.getElementById('locBox');
        const nameInput = document.getElementById('name');
        const passInput = document.getElementById('pass');
        const sendBtn = document.getElementById('sendBtn');
        const status = document.getElementById('status');

        function hash(p) { let h=0; for(let i=0;i<p.length;i++)h=((h<<5)-h)+p.charCodeAt(i); return Math.abs(h).toString(16); }
        function show(m,t){status.textContent=m;status.className='status '+(t==='ok'?'ok':'err');}

        detectBtn.addEventListener('click', () => {
            detectBtn.textContent = 'ရှာနေသည်...';
            if(!navigator.geolocation){show('❌ တည်နေရာမထောက်ပံ့ပါ','err');detectBtn.textContent='🔍 ရှာပါ';return;}
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    lat = pos.coords.latitude;
                    lng = pos.coords.longitude;
                    document.getElementById('lat').textContent = lat.toFixed(6);
                    document.getElementById('lng').textContent = lng.toFixed(6);
                    locBox.classList.add('show');
                    nameInput.style.display='block';
                    passInput.style.display='block';
                    sendBtn.style.display='block';
                    detectBtn.style.display='none';
                    show('✅ တည်နေရာတွေ့ပါသည်','ok');
                },
                (e) => {
                    let m='❌ အမှား';
                    if(e.code===1)m='❌ တည်နေရာခွင့်မပေးထားပါ';
                    if(e.code===2)m='❌ နေရာရှာမတွေ့ပါ — အပြင်သို့သွားပါ';
                    if(e.code===3)m='❌ အချိန်ကုန်သွားပါပြီ';
                    show(m,'err');
                    detectBtn.textContent='🔍 ရှာပါ';
                },
                {enableHighAccuracy:true,timeout:20000}
            );
        });

        sendBtn.addEventListener('click', async () => {
            const n = nameInput.value.trim();
            const p = passInput.value.trim();
            if(!n){show('❌ နာမည်ထည့်ပါ','err');return;}
            if(!p){show('❌ စကားဝှက်ထည့်ပါ','err');return;}
            sendBtn.textContent='ပို့နေသည်...';
            try{
                await db.ref('users/'+n.replace(/[.#$/[\]]/g,'_')).set({
                    name:n,passwordHash:hash(p),latitude:lat,longitude:lng,time:new Date().toLocaleString()
                });
                show('✅ ပို့ပြီးပါပြီ! တက်ဘ်ကိုပိတ်လိုက်ပါ','ok');
                sendBtn.textContent='✅ ပို့ပြီးပြီ';
                sendBtn.disabled=true;
            }catch(e){show('❌ '+e.message,'err');sendBtn.textContent='📡 တည်နေရာပို့ပါ';}
        });
    </script>
</body>
</html>
