<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📍 တည်နေရာပို့ရန်</title>
    <script src="https://www.gstatic.com/firebasejs/11.3.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.3.1/firebase-database-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
        body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:20px;display:flex;align-items:center;justify-content:center;}
        .box{background:white;border-radius:20px;padding:25px;max-width:400px;width:100%;}
        h2{text-align:center;color:#1a1a2e;margin-bottom:20px;}
        button{width:100%;padding:14px;font-size:16px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-bottom:15px;}
        .btn-blue{background:#667eea;color:white;}
        .btn-green{background:#10b981;color:white;}
        input{width:100%;padding:14px;font-size:16px;border:2px solid #ddd;border-radius:10px;margin-bottom:12px;}
        .result{background:#f0f4ff;padding:15px;border-radius:10px;margin-bottom:15px;display:none;}
        .result.show{display:block;}
        .status{padding:12px;border-radius:8px;margin-top:15px;display:none;}
        .ok{background:#d4edda;color:#155724;display:block;}
        .err{background:#f8d7da;color:#721c24;display:block;}
    </style>
</head>
<body>
    <div class="box">
        <h2>📍 တည်နေရာပို့ရန်</h2>

        <button id="locBtn" class="btn-blue">🔍 ၁။ တည်နေရာရှာပါ</button>
        
        <div id="resultBox" class="result">
            <p><b>လတီကျူ့ဒ်:</b> <span id="lat">--</span></p>
            <p><b>လောင်ဂျီကျူ့ဒ်:</b> <span id="lng">--</span></p>
        </div>

        <input type="text" id="name" placeholder="အမည်ရိုက်ထည့်ပါ">
        <input type="text" id="pass" placeholder="စကားဝှက်ရိုက်ထည့်ပါ">
        
        <button id="sendBtn" class="btn-green">📤 ၂။ ပို့ပါ</button>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCrto0f0amUQbRpfshWgyvErrurzq0Ksjw",
            authDomain: "my-location-share-8bf0f.firebaseapp.com",
            databaseURL: "https://my-location-share-8bf0f-default-rtdb.firebaseio.com",
            projectId: "my-location-share-8bf0f",
            storageBucket: "my-location-share-8bf0f.firebasestorage.app",
            messagingSenderId: "211556349618",
            appId: "1:211556349618:web:bd5b82d1a01202064bbbab"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let lat, lng;
        const locBtn = document.getElementById('locBtn');
        const resultBox = document.getElementById('resultBox');
        const sendBtn = document.getElementById('sendBtn');
        const status = document.getElementById('status');

        function hash(p) { let h=0; for(let i=0;i<p.length;i++)h=((h<<5)-h)+p.charCodeAt(i); return Math.abs(h).toString(16); }
        function show(m,t){status.textContent=m;status.className='status '+(t==='ok'?'ok':'err');}

        locBtn.addEventListener('click', () => {
            locBtn.textContent = 'ရှာနေသည်...';
            if(!navigator.geolocation){show('❌ တည်နေရာမရနိုင်ပါ','err');locBtn.textContent='🔍 ရှာပါ';return;}
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    lat = pos.coords.latitude;
                    lng = pos.coords.longitude;
                    document.getElementById('lat').textContent = lat.toFixed(6);
                    document.getElementById('lng').textContent = lng.toFixed(6);
                    resultBox.classList.add('show');
                    locBtn.textContent = '✅ တွေ့ပြီး';
                    show('✅ အခု အမည်နှင့် စကားဝှက်ရိုက်ပါ','ok');
                },
                () => {show('❌ ရှာမတွေ့ပါ — VPN ပိတ်၊ အပြင်သို့သွားပါ','err');locBtn.textContent='🔍 ရှာပါ';},
                {enableHighAccuracy:true,timeout:20000}
            );
        });

        sendBtn.addEventListener('click', async () => {
            const n = document.getElementById('name').value.trim();
            const p = document.getElementById('pass').value.trim();
            
            if(!n){show('❌ အမည်ရိုက်ပါ','err');return;}
            if(!p){show('❌ စကားဝှက်ရိုက်ပါ','err');return;}
            if(!lat || !lng){show('❌ တည်နေရာမရသေးပါ','err');return;}
            
            sendBtn.textContent = 'ပို့နေသည်...';
            try{
                await db.ref('users/'+n.replace(/[.#$/[\]]/g,'_')).set({
                    name:n, passwordHash:hash(p), latitude:lat, longitude:lng, time:new Date().toLocaleString()
                });
                show('✅ ပို့ပြီးပါပြီ!','ok');
                sendBtn.textContent = '✅ ပို့ပြီး';
            }catch(e){show('❌ အမှား: '+e.message,'err');sendBtn.textContent='📤 ပို့ပါ';}
        });
    </script>
</body>
</html>
