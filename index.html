<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ကျွန်ုပ်၏မြေပုံ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    #map { width: 100%; height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // မြေပုံကို ရန်ကုန် ကမာရွတ်မှာ အရင်ပြမယ်
    var map = L.map('map').setView([16.8321, 96.1353], 14);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // 📍 ဖုန်းရဲ့တည်နေရာကို အလိုအလျောက်ရှာမယ်
    map.locate({
      setView: true,
      maxZoom: 16,
      timeout: 10000
    });

    // ✅ တည်နေရာတွေ့ရင် အမှတ်အသားထိုးမယ်
    map.on('locationfound', function(e) {
      L.marker(e.latlng)
        .addTo(map)
        .bindPopup("📍 သင်ဤနေရာတွင်ရှိသည်!<br>တိကျမှု: " + Math.round(e.accuracy) + " မီတာ")
        .openPopup();
    });

    // ❌ ရှာမတွေ့ရင် သတိပေးမယ်
    map.on('locationerror', function(e) {
      alert("⚠️ တည်နေရာရှာမရပါ။ ဖုန်းရဲ့တည်နေရာ(GPS)ကို ဖွင့်ပါ၊ ခွင့်ပြုပါ။");
    });
  </script>
</body>
</html>
