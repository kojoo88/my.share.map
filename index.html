<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📍 မျှဝေထားသောတည်နေရာ</title>
    <script src="https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.3.1/firebase-database.js"></script>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:system-ui, sans-serif;}
        body {background:linear-gradient(135deg, #3b82f6, #1d4ed8); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;}
        .card {background:white; border-radius:20px; padding:30px; max-width:420px; width:100%; box-shadow:0 10px 40px rgba(0,0,0,0.15); text-align:center;}
        h1 {color:#1d4ed8; font-size:22px; margin-bottom:5px;}
        .subtitle {color:#64748b; font-size:14px; margin-bottom:25px;}
        .dot {display:inline-block; width:10px; height:10px; background:#22c55e; border-radius:50%; margin-right:6px; animation:pulse 2s infinite;}
        @keyframes pulse {0%{box-shadow:0 0 0 0 rgba(34,197,94,0.5);}70%{box-shadow:0 0 0 10px rgba(34,197,94,0);}100%{box-shadow:0 0 0 0 rgba(34,197,94,0);}}
        .info-box {background:#eff6ff; border-radius:12px; padding:20px; margin-bottom:20px; text-align:left;}
        .info-row {margin-bottom:12px; font-size:15px;}
        .label {color:#64748b; font-size:13px; margin-bottom:3px;}
        .value {color:#1e40af; font-weight:600; font-size:16px;}
        .time {color:#f59e0b; font-size:13px; margin-bottom:15px;}
        .map-link {display:block; background:#16a34a; color:white; padding:15px; border-radius:12px; text-decoration:none; font-weight:600; font-size:16px;}
        .waiting {padding:40px 20px; color:#64748b;}
    </style>
</head>
<body>
    <div class="card">
        <h1>📍 မျှဝေထားသောတည်နေရာ</h1>
        <p class="subtitle"><span class="dot"></span> တိုက်ရိုက်အပ်ဒိတ်လုပ်နေသည်</p>
        <div id="waitingArea" class="waiting">
            <p>⏳ တည်နေရာကို စောင့်မျှော်နေသည်...</p>
        </div>
        <div id="locationArea" style="display:none;">
            <div class="time">⏰ နောက်ဆုံးအပ်ဒိတ် - <span id="updateTime">--</span></div>
            <div class="info-box">
                <div class="info-row"><div class="label">လတီကျူ့ဒ်</div><div class="value" id="lat">--</div></div>
                <div class="info-row"><div class="label">လောင်ဂျီကျူ့ဒ်</div><div class="value" id="lon">--</div></div>
            </div>
            <a href="" id="gmapLink" class="map-link" target="_blank">🌍 Google Maps တွင်ကြည့်ရှုရန်</a>
        </div>
    </div>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCrto0f0amUQbRpfshWgyvErrurzq0Ksjw",
            authDomain: "my-location-share-8bf0f.firebaseapp.com",
            databaseURL: "https://my-location-share-8bf0f-default-rtdb.firebaseio.com",
            projectId: "my-location-share-8bf0f",
            storageBucket: "my-location-share-8bf0f.firebasestorage.app",
            messagingSenderId: "211556349618",
            appId: "1:211556349618:web:bd5b82d1a01202064bbbab"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        db.ref('locations').on('value', s => {
            const d = s.val();
            if (d && d.latitude) {
                document.getElementById('waitingArea').style.display = 'none';
                document.getElementById('locationArea').style.display = 'block';
                document.getElementById('lat').textContent = d.latitude.toFixed(6);
                document.getElementById('lon').textContent = d.longitude.toFixed(6);
                document.getElementById('updateTime').textContent = d.timestamp;
                document.getElementById('gmapLink').href = `https://google.com/maps?q=${d.latitude},${d.longitude}`;
            }
        });
    </script>
</body>
    </html>
