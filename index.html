<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ကျွန်ုပ်နေရာ မျှဝေရန်</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: Arial, sans-serif; }
    #map { width: 100%; height: calc(100vh - 120px); }
    .top-hint {
      position: fixed; top: 0; left: 0; right: 0;
      background: #e3f2fd; padding: 12px; text-align: center;
      font-size: 15px; color: #0d47a1; z-index: 1000;
      border-bottom: 1px solid #90caf9;
    }
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #ffffff; padding: 15px; box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
      z-index: 1000;
    }
    .action-btn {
      width: 100%; padding: 14px; font-size: 16px; font-weight: bold;
      border: none; border-radius: 8px; cursor: pointer; transition: 0.2s;
    }
    .btn-inactive { background: #e0e0e0; color: #999; cursor: default; }
    .btn-ready { background: #2196f3; color: white; }
    .btn-copied { background: #4caf50; color: white; }
    .link-box {
      margin-top: 10px; padding: 10px; background: #f5f5f5;
      border-radius: 4px; font-size: 12px; word-break: break-all; display: none;
    }
  </style>
</head>
<body>
  <div class="top-hint" id="topHint">👆 မြေပုံပေါ်မှာ သင့်နေရာကို တစ်ချက်နှိပ်ပါ</div>
  <div id="map"></div>
  <div class="bottom-bar">
    <button class="action-btn btn-inactive" id="actionBtn" disabled>ဦးစွာ နေရာကို နှိပ်ပါ</button>
    <div class="link-box" id="linkBox"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // မြန်မာနိုင်ငံ အလယ်မှာ အစပြုမယ်
    var map = L.map('map').setView([19.7406, 96.2195], 6);
    var myMarker = null;
    var shareUrl = '';
    var actionBtn = document.getElementById('actionBtn');
    var topHint = document.getElementById('topHint');
    var linkBox = document.getElementById('linkBox');

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // မြေပုံပေါ်ကို နှိပ်လိုက်တဲ့အခါ
    map.on('click', function (e) {
      if (myMarker) map.removeLayer(myMarker);

      myMarker = L.marker(e.latlng)
        .addTo(map)
        .bindPopup(
          '<strong>သင့်ရွေးချယ်ထားသောနေရာ</strong><br>' +
          'လတ္တီကျု: ' + e.latlng.lat.toFixed(6) + '<br>' +
          'လောင်ဂျီကျု: ' + e.latlng.lng.toFixed(6)
        )
        .openPopup();

      shareUrl = 'https://www.google.com/maps/search/?api=1&query=' +
        e.latlng.lat + ',' + e.latlng.lng;

      topHint.innerHTML = '✅ နေရာရွေးချယ်ပြီးပါပြီ';
      actionBtn.innerHTML = '📋 လင့်ခ်ကူးယူပါ';
      actionBtn.className = 'action-btn btn-ready';
      actionBtn.disabled = false;
      linkBox.style.display = 'none';
    });

    // ကူးယူခလုတ် နှိပ်တဲ့အခါ
    actionBtn.addEventListener('click', function () {
      if (!shareUrl) return;

      // ကူးယူကြိုးပမ်းမယ်
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl).then(function () {
          showCopied();
        }).catch(function () {
          showFallbackLink();
        });
      } else {
        showFallbackLink();
      }
    });

    function showCopied() {
      actionBtn.innerHTML = '✅ ကူးယူပြီးပါပြီ';
      actionBtn.className = 'action-btn btn-copied';
      linkBox.style.display = 'block';
      linkBox.innerHTML = '<strong>လင့်ခ်-</strong><br>' + shareUrl;

      setTimeout(function () {
        actionBtn.innerHTML = '📋 လင့်ခ်ကူးယူပါ';
        actionBtn.className = 'action-btn btn-ready';
      }, 2500);
    }

    function showFallbackLink() {
      alert('အောက်ကလင့်ခ်ကို ကူးယူပါ-\\n\\n' + shareUrl);
      linkBox.style.display = 'block';
      linkBox.innerHTML = '<strong>လင့်ခ်-</strong><br>' + shareUrl +
        '<br><small>အပေါ်ကလင့်ခ်ကို ဖိထားပြီး ကူးယူပါ</small>';
    }
  </script>
</body>
</html>
