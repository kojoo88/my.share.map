<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👥 တည်နေရာများကြည့်ရှုခြင်း location ဖွင့်ဖို့မမေ့နဲ့နော်| Premium</title>
    <script src="https://www.gstatic.com/firebasejs/11.3.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.3.1/firebase-database-compat.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
        body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:24px;}
        .container{max-width:500px;margin:0 auto;}
        
        .header{text-align:center;margin-bottom:28px;}
        .header-icon{font-size:40px;margin-bottom:8px;}
        h1{color:white;font-size:26px;font-weight:700;margin-bottom:4px;}
        .subtitle{color:rgba(255,255,255,0.8);font-size:14px;}
        
        .search-wrapper{margin-bottom:24px;position:relative;}
        .search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:18px;}
        #searchInput{width:100%;padding:16px 16px 16px 48px;font-size:16px;border:none;border-radius:16px;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);box-shadow:0 4px 20px rgba(0,0,0,0.08);}
        #searchInput:focus{outline:none;box-shadow:0 6px 24px rgba(0,0,0,0.12);}
        
        .my-card{background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-radius:24px;padding:24px;margin-bottom:28px;box-shadow:0 10px 40px rgba(0,0,0,0.1);}
        .my-title{font-size:16px;font-weight:600;color:#1a1a2e;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
        .primary-btn{width:100%;padding:15px;font-size:15px;font-weight:600;border:none;border-radius:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;cursor:pointer;transition:transform 0.2s;}
        .primary-btn:disabled{background:#d4d4d8;cursor:not-allowed;}
        .primary-btn:active{transform:scale(0.98);}
        .my-coords{margin-top:16px;display:none;}
        .my-coords.show{display:block;}
        .coord-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f1f3;font-size:14px;}
        .coord-row:last-child{border-bottom:none;}
        .c-label{color:#71717a;}
        .c-value{color:#1a1a2e;font-weight:600;font-family:'SF Mono',monospace;}
        .map-btn{display:block;text-align:center;background:linear-gradient(135deg,#10b981,#059669);color:white;text-decoration:none;padding:12px;border-radius:12px;font-weight:600;font-size:14px;margin-top:14px;}
        
        .stats-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
        .count-text{color:white;font-size:15px;}
        .count-text span{font-weight:700;font-size:18px;}
        .note-text{color:rgba(255,255,255,0.7);font-size:12px;}
        
        .user-card{background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-radius:20px;padding:22px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,0.08);transition:transform 0.2s;}
        .user-card:active{transform:scale(0.99);}
        .user-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
        .user-name{font-size:17px;font-weight:600;color:#1a1a2e;display:flex;align-items:center;gap:8px;}
        .time-badge{font-size:11px;background:#ede9fe;color:#5b21b6;padding:4px 10px;border-radius:20px;font-weight:500;}
        
        .locked-box{background:#fffbeb;border:2px solid #fef3c7;border-radius:14px;padding:24px;text-align:center;}
        .lock-icon{font-size:36px;margin-bottom:10px;}
        .lock-text{color:#92400e;font-size:14px;margin-bottom:14px;}
        .pass-field{width:100%;padding:12px 14px;font-size:15px;border:2px solid #fef3c7;border-radius:10px;margin-bottom:12px;}
        .pass-field:focus{outline:none;border-color:#f59e0b;}
        .unlock-btn{background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;padding:10px 24px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;}
        
        .info-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;}
        .i-label{color:#71717a;}
        .i-value{color:#1a1a2e;font-weight:500;font-family:'SF Mono',monospace;}
        .time-info{font-size:12px;color:#a1a1aa;margin-top:10px;padding-top:10px;border-top:1px solid #f1f1f3;}
        .expire-warning{font-size:12px;color:#d97706;margin-top:6px;}
        
        .empty-state{text-align:center;padding:60px 30px;color:white;}
        .empty-icon{font-size:56px;margin-bottom:16px;opacity:0.6;}
        .empty-text{font-size:16px;opacity:0.8;}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">👥</div>
            <h1>တည်နေရာများ ကြည့်ရှုခြင်း</h1>
            <p class="subtitle">လုံခြုံစွာ ကြည့်ရှုနိုင်ပါသည် • ဒေတာသည် ၁ နာရီသာ သိမ်းဆည်းထားမည်</p>
        </div>

        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="အမည်ဖြင့်ရှာဖွေရန်...">
        </div>

        <!-- ကိုယ့်နေရာ -->
        <div class="my-card">
            <div class="my-title">👁️ ကျွန်ုပ်၏တည်နေရာ</div>
            <button id="myLocBtn" class="primary-btn">🔍 တည်နေရာကို ရှာဖွေရန်</button>
            <div id="myCoordsBox" class="my-coords">
                <div class="coord-row"><span class="c-label">လတီကျူ့ဒ်</span><span class="c-value" id="myLat">--</span></div>
                <div class="coord-row"><span class="c-label">လောင်ဂျီကျူ့ဒ်</span><span class="c-value" id="myLng">--</span></div>
                <a id="myMapLink" href="" target="_blank" class="map-btn">🌍 မြေပုံပေါ်တွင် ဖွင့်ကြည့်ရန်</a>
            </div>
        </div>

        <div class="stats-bar">
            <p class="count-text">စုစုပေါင်း - <span id="totalCount">0</span> ဦး</p>
            <p class="note-text">⏰ ၁ နာရီအကြာတွင် အလိုအလျောက်ဖျက်မည်</p>
        </div>

        <div id="usersList"></div>
        <div id="emptyState" class="empty-state" style="display:none;">
            <div class="empty-icon">📍</div>
            <p class="empty-text">မည်သူမျှ တည်နေရာမမျှဝေသေးပါ</p>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCrto0f0amUQbRpfshWgyvErrurzq0Ksjw",
            authDomain: "my-location-share-8bf0f.firebaseapp.com",
            databaseURL: "https://my-location-share-8bf0f-default-rtdb.firebaseio.com",
            projectId: "my-location-share-8bf0f",
            storageBucket: "my-location-share-8bf0f.firebasestorage.app",
            messagingSenderId: "211556349618",
            appId: "1:211556349618:web:bd5b82d1a01202064bbbab"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const unlocked = {};
        const ONE_HOUR = 60 * 60 * 1000;

        // ကိုယ့်နေရာ
        const myLocBtn = document.getElementById('myLocBtn');
        myLocBtn.addEventListener('click', function(){
            this.textContent = '⏳ ရှာဖွေနေသည်...';
            if(!navigator.geolocation){
                alert('❌ တည်နေရာဝန်ဆောင်မှု မရရှိနိုင်ပါ');
                this.textContent = '🔍 တည်နေရာကို ရှာဖွေရန်';
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    document.getElementById('myLat').textContent = pos.coords.latitude.toFixed(6);
                    document.getElementById('myLng').textContent = pos.coords.longitude.toFixed(6);
                    document.getElementById('myMapLink').href = `https://google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    document.getElementById('myCoordsBox').classList.add('show');
                    this.textContent = '✅ တည်နေရာပြပြီး';
                    this.style.background = 'linear-gradient(135deg,#10b981,#059669)';
                },
                () => {
                    alert('❌ တည်နေရာရှာမတွေ့ပါ — VPN ပိတ်ပါ၊ အပြင်သို့သွားပါ');
                    this.textContent = '🔍 တည်နေရာကို ရှာဖွေရန်';
                },
                {enableHighAccuracy:true, timeout:15000}
            );
        });

        function hashPass(p) { let h=0; for(let i=0;i<p.length;i++)h=((h<<5)-h)+p.charCodeAt(i); return Math.abs(h).toString(16); }
        window.tryUnlock = function(key){
            const input = document.getElementById('passInput-'+key).value;
            db.ref('users/'+key).once('value').then(snap=>{
                const user = snap.val();
                if(user.passwordHash === hashPass(input)){
                    unlocked[key] = true;
                    renderList();
                }else{
                    alert('❌ စကားဝှက်မှားနေပါသည်');
                }
            });
        };

        function getTimeAgo(timeStr){
            const now = Date.now();
            const then = new Date(timeStr).getTime();
            const diff = now - then;
            const mins = Math.floor(diff / 60000);
            if(mins < 1) return 'အခုလေးတင်';
            if(mins < 60) return `${mins} မိနစ်အကြာ`;
            return `${Math.floor(mins/60)} နာရီအကြာ`;
        }

        function isExpired(timeStr){
            return Date.now() - new Date(timeStr).getTime() > ONE_HOUR;
        }

        function willExpireSoon(timeStr){
            return Date.now() - new Date(timeStr).getTime() > ONE_HOUR * 0.75;
        }

        function generateCard(key, user){
            const timeAgo = getTimeAgo(user.time);
            const expiringSoon = willExpireSoon(user.time);
            
            if(unlocked[key]){
                return `
                <div class="user-card">
                    <div class="user-header">
                        <div class="user-name">🔓 ${user.name}</div>
                        <span class="time-badge">${timeAgo}</span>
                    </div>
                    <div class="info-row"><span class="i-label">လတီကျူ့ဒ်</span><span class="i-value">${user.latitude.toFixed(6)}</span></div>
                    <div class="info-row"><span class="i-label">လောင်ဂျီကျူ့ဒ်</span><span class="i-value">${user.longitude.toFixed(6)}</span></div>
                    <a href="https://google.com/maps?q=${user.latitude},${user.longitude}" target="_blank" class="map-btn">🌍 မြေပုံပေါ်တွင် ကြည့်ရှုရန်</a>
                    <div class="time-info">⏰ ပို့ချိန် - ${user.time}</div>
                    ${expiringSoon ? '<div class="expire-warning">⚠️ ၁၅မိနစ်အတွင်း ဖျက်ပါမည်</div>' : ''}
                </div>`;
            }
            return `
            <div class="user-card">
                <div class="user-header">
                    <div class="user-name">🔒 ${user.name}</div>
                    <span class="time-badge">${timeAgo}</span>
                </div>
                <div class="locked-box">
                    <div class="lock-icon">🔒</div>
                    <div class="lock-text">စကားဝှက်ဖြင့်ကာကွယ်ထားသည်</div>
                    <input type="password" id="passInput-${key}" class="pass-field" placeholder="စကားဝှက်ထည့်ပါ">
                    <button class="unlock-btn" onclick="tryUnlock('${key}')">ဖွင့်ကြည့်ရန်</button>
                    ${expiringSoon ? '<div class="expire-warning" style="margin-top:10px;">⚠️ ၁၅မိနစ်အတွင်း ဖျက်ပါမည်</div>' : ''}
                </div>
            </div>`;
        }

        let searchQuery = '';
        document.getElementById('searchInput').addEventListener('input', e=>{
            searchQuery = e.target.value.trim().toLowerCase();
            renderList();
        });

        function renderList(){
            db.ref('users').once('value').then(snap=>{
                const data = snap.val() || {};
                
                // သက်တမ်းကုန်သွားတာများ ဖျက်
                const deletes = [];
                Object.keys(data).forEach(k=>{
                    if(isExpired(data[k].time)) deletes.push(db.ref('users/'+k).remove());
                });
                
                Promise.all(deletes).then(()=>{
                    return db.ref('users').once('value');
                }).then(updatedSnap=>{
                    const fresh = updatedSnap.val() || {};
                    let keys = Object.keys(fresh);
                    
                    // ရှာဖွေမှု စစ်ထုတ်
                    if(searchQuery){
                        keys = keys.filter(k=>fresh[k].name.toLowerCase().includes(searchQuery));
                    }
                    
                    // အသစ်ဆုံး အပေါ်က
                    keys.sort((a,b)=>new Date(fresh[b].time) - new Date(fresh[a].time));
                    
                    const listEl = document.getElementById('usersList');
                    const emptyEl = document.getElementById('emptyState');
                    const countEl = document.getElementById('totalCount');
                    
                    countEl.textContent = keys.length;
                    
                    if(keys.length === 0){
                        listEl.innerHTML = '';
                        emptyEl.style.display = 'block';
                        return;
                    }
                    
                    emptyEl.style.display = 'none';
                    listEl.innerHTML = keys.map(k=>generateCard(k, fresh[k])).join('');
                });
            });
        }

        db.ref('users').on('value', renderList);
        setInterval(renderList, 60000);
    </script>
</body>
                                                                          </html>
