<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📍 ကျွန်တော့်တည်နေရာ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 {
            color: #1e40af;
            font-size: 22px;
            margin-bottom: 10px;
        }
        p {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn:hover { background: #1d4ed8; }
        .btn:disabled { background: #9ca3af; cursor: not-allowed; }
        .result {
            margin-top: 25px;
            display: none;
        }
        .result.show { display: block; }
        .coords {
            background: #eff6ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #1e3a8a;
        }
        .map-link {
            display: block;
            background: #10b981;
            color: white;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }
        .map-link:hover { background: #059669; }
        .copy-btn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            margin-top: 12px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }
        .loading { display: none; color: #2563eb; margin-top: 15px; }
        .error { color: #dc2626; margin-top: 15px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📍 တည်နေရာမျှဝေခြင်း</h1>
        <p>အောက်ကခလုတ်ကိုနှိပ်ပြီး သင့်တည်နေရာကို ရယူပါ</p>
        
        <button class="btn" id="getLocBtn">📌 ကျွန်တော့်တည်နေရာကို ရယူမည်</button>
        
        <div class="loading" id="loading">⏳ တည်နေရာရှာဖွေနေသည်... ကျေးဇူးပြုပြီး ခွင့်ပြုပါ</div>
        <div class="error" id="error">❌ တည်နေရာရှာမရပါ။ ကျေးဇူးပြုပြီး တည်နေရာဝန်ဆောင်မှုကို ဖွင့်ပါ။</div>
        
        <div class="result" id="result">
            <div class="coords">
                <strong>လတီကျူ့ဒ် (Latitude):</strong><br>
                <span id="lat">--</span><br><br>
                <strong>လောင်ဂျီကျူ့ဒ် (Longitude):</strong><br>
                <span id="lon">--</span>
            </div>
            <a href="" id="mapLink" class="map-link" target="_blank">🌍 မြေပုံပေါ်ကြည့်ရန် / Share Map</a>
            <button class="copy-btn" id="copyBtn">📋 မြေပုံလင့်ကို ကူးယူမည်</button>
        </div>
    </div>

    <script>
        const getLocBtn = document.getElementById('getLocBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const result = document.getElementById('result');
        const latEl = document.getElementById('lat');
        const lonEl = document.getElementById('lon');
        const mapLink = document.getElementById('mapLink');
        const copyBtn = document.getElementById('copyBtn');
        let fullMapUrl = '';

        getLocBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
                error.style.display = 'block';
                error.textContent = '❌ သင့်ဘရောင်ဇာက တည်နေရာရှာဖွေခြင်းကို မထောက်ပံ့ပါ။';
                return;
            }

            // UI ပြင်ဆင်ခြင်း
            loading.style.display = 'block';
            error.style.display = 'none';
            result.classList.remove('show');
            getLocBtn.disabled = true;

            // တည်နေရာတောင်းခံခြင်း
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    latEl.textContent = lat;
                    lonEl.textContent = lon;
                    
                    // Google Maps လင့်ဖန်တီးခြင်း
                    fullMapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
                    mapLink.href = fullMapUrl;
                    
                    loading.style.display = 'none';
                    result.classList.add('show');
                    getLocBtn.disabled = false;
                },
                (err) => {
                    loading.style.display = 'none';
                    error.style.display = 'block';
                    error.textContent = '❌ တည်နေရာရှာမရပါ။ ခွင့်မပြုထားခြင်း သို့မဟုတ် အချက်ပြအားနည်းနေခြင်းကြောင့်ဖြစ်နိုင်ပါတယ်။';
                    getLocBtn.disabled = false;
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        });

        // လင့်ကိုကူးယူခြင်း
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(fullMapUrl).then(() => {
                copyBtn.textContent = '✅ လင့်ကိုကူးပြီးပါပြီ!';
                setTimeout(() => {
                    copyBtn.textContent = '📋 မြေပုံလင့်ကို ကူးယူမည်';
                }, 2500);
            });
        });
    </script>
</body>
</html>
